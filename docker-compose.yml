services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: biketracker
      POSTGRES_USER: biketracker
      POSTGRES_PASSWORD: biketracker
    ports: ["5433:5432"]
    # Docker Desktop 이 재시작돼도 DB 가 자동으로 뜨게 합니다. docker stop 으로 직접 내린 경우는 그대로 둡니다.
    restart: unless-stopped
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biketracker"]
      interval: 5s
      retries: 10

  inference:
    build: ./inference-fastapi
    volumes: ["./inference-fastapi/models:/app/models:ro"]
    # 포트를 밖으로 열지 않습니다. Spring 만 http://inference:8000 으로 부릅니다.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/healthz || exit 1"]
      interval: 10s
      retries: 12
      start_period: 60s

  spring:
    build: ./server-spring
    depends_on:
      postgis: { condition: service_healthy }
      inference: { condition: service_healthy }
    environment:
      DB_HOST: postgis
      INFERENCE_URL: http://inference:8000
    ports: ["8080:8080"]

volumes:
  # 실제 데이터(biketracker, biketracker_test)는 server-spring_pgdata 에 있습니다. 이 볼륨은 예전
  # server-spring/docker-compose.yml 이 만들었고, 루트 compose 의 기본 프로젝트 이름(bike-tracker)으로는
  # bike-tracker_pgdata 라는 빈 볼륨을 보게 됩니다. external 로 이름을 고정해 어느 프로젝트에서 띄우든
  # 같은 볼륨을 보게 합니다. external 이라 compose 가 만들지도, down -v 로 지우지도 않습니다.
  pgdata:
    external: true
    name: server-spring_pgdata
